services:
  mysql-master:
    image: mysql:8.0
    container_name: sg-mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "127307"
      MYSQL_DATABASE: blade
    ports:
      - "3306:3306"
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  mysql-slave:
    image: mysql:8.0
    container_name: sg-mysql-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "127307"
    ports:
      - "3307:3306"
    command: --server-id=2 --relay-log=relay-bin --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    depends_on:
      - mysql-master

  redis-master:
    image: redis:7
    container_name: sg-redis-master
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass 127307

  redis-slave:
    image: redis:7
    container_name: sg-redis-slave
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379 --masterauth 127307 --requirepass 127307
    depends_on:
      - redis-master

  redis-sentinel:
    image: redis:7
    container_name: sg-redis-sentinel1
    restart: unless-stopped
    ports:
      - "26379:26379"
    command: >
      bash -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 1
      sentinel auth-pass mymaster 127307
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1' > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf"
    depends_on:
      - redis-master
      - redis-slave

  minio:
    image: minio/minio:latest
    container_name: sg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: remote_user
      MINIO_ROOT_PASSWORD: 0123456789.abcdefg
    ports:
      - "9000:9000"
      - "9001:9001"

  nginx:
    image: nginx:1.25
    container_name: sg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sg-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: sg-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "127307"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql_master_data:
