server {
    listen 80;
    server_name localhost;

    # 第三方 blade-springboot（默认 9999）
    location /blade-auth/ {
        proxy_pass http://host.docker.internal:9999;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Blade-Auth $http_blade_auth;
        proxy_set_header Tenant-Id $http_tenant_id;
    }
    location /blade-user/ {
        proxy_pass http://host.docker.internal:9999;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Blade-Auth $http_blade_auth;
        proxy_set_header Tenant-Id $http_tenant_id;
    }

    # 考试工程 exam_demo（context-path=/exam，端口 8080）
    location /exam/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }
}
