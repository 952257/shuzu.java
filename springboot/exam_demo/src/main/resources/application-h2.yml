# 本机没有 MySQL 时使用：spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/exam;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
