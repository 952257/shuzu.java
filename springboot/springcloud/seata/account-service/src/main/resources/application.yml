# Seata 配置
seata:
  enabled: true
  # 事务组名称（必须与 server 中 tx-service-group 一致）
  tx-service-group: my_test_tx_group
  # Seata Server 地址（若用注册中心可不配）
  #  service:
  #    vgroup-mapping:
  #      my_test_tx_group: default
  config:
    type: nacos
    nacos:
      server-addr: 192.168.150.130:8848
      namespace:
      group: SEATA_GROUP
      data-id: seataServer.properties

  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 192.168.150.130:8848
      namespace:
      group: SEATA_GROUP

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: '*'#开放所有端点