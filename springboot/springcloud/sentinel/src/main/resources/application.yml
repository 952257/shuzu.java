server:
  port: 6001

spring:
  application:
    name: sentinel
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.150.130:8848
    sentinel:
      transport:
        # Sentinel 控制台地址
        dashboard: 192.168.232.100:8088
        # 默认情况下 Sentinel 会在客户端首次调用的时候进行初始化，开始向控制台发送心跳包
      eager: true # 配置 sentinel.eager=true 时，取消Sentinel控制台懒加载功能
      datasource:
        ds1:
          nacos:
            server-addr: 192.168.150.130:8848
            dataId: sentinel.json
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: flow #流控
        ds2:
          nacos:
            server-addr: 192.168.150.130:8848
            dataId: sentinel2.json
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: degrade #熔断降级