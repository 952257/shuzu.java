# TT 小区物业：MySQL + 后端 + 前端(Nginx) 一键 Docker 部署
# 使用：cd springboot/tt-deploy && docker compose up -d --build
#
# Web 入口（前端 + /app 反代）：http://localhost:8080
# 后端直连（可选）：http://localhost:8088
# MySQL（可选）：localhost:3309

services:
  mysql:
    image: mysql:8.0
    container_name: tt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hjx127307}
      MYSQL_DATABASE: TT
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3309}:3306"
    volumes:
      - tt-mysql-data:/var/lib/mysql
      - ./mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./mysql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-hjx127307}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build:
      context: ../springboot-TT
      dockerfile: Dockerfile
    image: tt-backend:local
    container_name: tt-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: TT
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hjx127307}
      TT_JWT_SECRET: ${TT_JWT_SECRET:-tt-homecommunity-secret-key-2026}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_HOST_PORT:-8088}:8088"

  frontend:
    build:
      context: ../springboot-TT-web
      dockerfile: Dockerfile
    image: tt-frontend:local
    container_name: tt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_HOST_PORT:-8080}:80"

volumes:
  tt-mysql-data:
